<VirtualHost *:80>
    servername localhost
    ServerAdmin localhost
    DocumentRoot /var/www/html/site/webroot

    <Directory /var/www/html/site/webroot>
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
    </Directory>

    Alias /uploads /mnt/08B84889B84876EA/wwwroot/projetos/shared/uploads
    <Directory /mnt/08B84889B84876EA/wwwroot/projetos/shared/uploads>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
<VirtualHost *:80>
    servername cms.localhost
    ServerAdmin localhost
    DocumentRoot /var/www/html/cms/webroot

    <Directory /var/www/html/cms/webroot>
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
